<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="drop" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#5ff0cf"/>
      <stop offset="0.45" stop-color="#22b8c9"/>
      <stop offset="1" stop-color="#1a5fc4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#0b2f6b" stop-opacity="0.35"/>
    </linearGradient>
    <!-- one chain link, centred on the origin before placement -->
    <rect id="link" x="-42" y="-22" width="84" height="44" rx="22" ry="22" fill="none"/>
    <clipPath id="upper"><rect x="-200" y="-200" width="400" height="200"/></clipPath>
    <clipPath id="lower"><rect x="-200" y="0" width="400" height="200"/></clipPath>
    <!-- B is cut where A passes over it (upper crossing) -->
    <mask id="cutB" maskUnits="userSpaceOnUse" x="-200" y="-200" width="400" height="400">
      <rect x="-200" y="-200" width="400" height="400" fill="#fff"/>
      <g clip-path="url(#upper)">
        <use xlink:href="#link" transform="translate(-26 0)" stroke="#000" stroke-width="32"/>
      </g>
    </mask>
    <!-- A is cut where B passes over it (lower crossing) -->
    <mask id="cutA" maskUnits="userSpaceOnUse" x="-200" y="-200" width="400" height="400">
      <rect x="-200" y="-200" width="400" height="400" fill="#fff"/>
      <g clip-path="url(#lower)">
        <use xlink:href="#link" transform="translate(26 0)" stroke="#000" stroke-width="32"/>
      </g>
    </mask>
  </defs>

  <!-- droplet body -->
  <path id="body" d="M128 10 C150 48 222 98 222 158 A94 94 0 0 1 34 158 C34 98 106 48 128 10 Z" fill="url(#drop)"/>
  <path d="M128 10 C150 48 222 98 222 158 A94 94 0 0 1 34 158 C34 98 106 48 128 10 Z" fill="url(#rim)"/>

  <!-- gloss -->
  <path d="M82 104 C70 118 62 136 62 156" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>

  <!-- interlocked chain links -->
  <g transform="translate(130 164) rotate(-45)" stroke="#ffffff" stroke-width="17" fill="none">
    <g mask="url(#cutA)"><use xlink:href="#link" transform="translate(-26 0)"/></g>
    <g mask="url(#cutB)"><use xlink:href="#link" transform="translate(26 0)"/></g>
  </g>
</svg>
