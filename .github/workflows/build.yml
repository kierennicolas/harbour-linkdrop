name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      online_test:
        description: 'Also upload a small test file to Litterbox (1 hour expiry) and download it back'
        type: boolean
        default: false
      release:
        description: 'Sailfish OS SDK target to build against (e.g. 4.5.0.16, 5.0.0.43, 5.1.0.11)'
        default: '4.5.0.16'

permissions:
  contents: read

env:
  # RPMs built against this release install on it and on every later one
  # (the Xperia XA2 is supported up to Sailfish OS 5.x).
  SFOS_RELEASE: ${{ inputs.release || '4.5.0.16' }}

jobs:
  test:
    name: Upload logic tests (desktop Qt 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qtbase5-dev qt5-qmake qtdeclarative5-dev-tools
      - name: Lint QML
        run: find qml -name '*.qml' -print0 | xargs -0 -n1 /usr/lib/qt5/bin/qmllint
      - name: Build tests
        run: |
          mkdir -p tests/build && cd tests/build
          qmake ../tests.pro && make -j"$(nproc)"
      - name: Run tests
        env:
          LINKDROP_ONLINE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.online_test && '1' || '0' }}
        run: tests/build/tst_uploader -v1

  rpm:
    name: RPM (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDK_IMAGE: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xperia XA2, X, 10 and other 32-bit devices. Single-target image (smaller).
          - arch: armv7hl
            image: coderus/sailfishos-platform-sdk-armv7hl
          # Xperia 10 II and newer running a 64-bit image.
          - arch: aarch64
            image: coderus/sailfishos-platform-sdk
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the SDK image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Pull Sailfish SDK ${{ env.SFOS_RELEASE }}
        run: docker pull "$SDK_IMAGE:$SFOS_RELEASE"
      - name: Build RPM
        id: build
        run: |
          set -o pipefail
          mkdir -p RPMS && chmod a+rwx RPMS
          if ! docker run --rm --privileged \
              -e SFOS_RELEASE -e SFOS_ARCH=${{ matrix.arch }} \
              -v "$GITHUB_WORKSPACE:/workspace" \
              "$SDK_IMAGE:$SFOS_RELEASE" /bin/bash /workspace/ci/sfos-build.sh 2>&1 | tee build.log; then
            ci/annotate.sh error "RPM build log" build.log 120
            exit 1
          fi
          ls -l RPMS
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: harbour-linkdrop-${{ matrix.arch }}
          path: RPMS/harbour-linkdrop-[0-9]*.${{ matrix.arch }}.rpm
          if-no-files-found: error
      - name: Harbour RPM validator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          rc=0
          docker run --rm --privileged \
            -e SFOS_RELEASE -e SFOS_ARCH=${{ matrix.arch }} \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$SDK_IMAGE:$SFOS_RELEASE" /bin/bash /workspace/ci/sfos-validate.sh 2>&1 | tee validate.log || rc=$?
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "Harbour validator ${{ matrix.arch }}" validate.log 200
          exit $rc
      - name: Load QML with real Silica
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.arch == 'armv7hl' }}
        run: |
          set -o pipefail
          rc=0
          docker run --rm --privileged \
            -e SFOS_RELEASE -e SFOS_ARCH=${{ matrix.arch }} \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$SDK_IMAGE:$SFOS_RELEASE" /bin/bash /workspace/ci/sfos-qml-smoke.sh 2>&1 | tee qml.log || rc=$?
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "QML smoke test" qml.log 200
          exit $rc

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          cat > notes.md <<EOF
          **Sony Xperia XA2 (and other 32-bit devices): download the \`armv7hl\` RPM.**
          The \`aarch64\` RPM is for 64-bit images (Xperia 10 II and newer).

          Built against Sailfish OS ${SFOS_RELEASE}; installs on that release and later.
          See the README for install steps.
          EOF
          gh release create "$TAG" dist/*.rpm --repo "$GITHUB_REPOSITORY" --title "LinkDrop ${TAG#v}" --notes-file notes.md
